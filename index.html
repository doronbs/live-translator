<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>מתרגם חי</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#76736b;--line:#e4e1d9;--accent:#c2410c;--soft:#fdebe1}
  @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1d1a;--ink:#f1efe9;--muted:#9a968c;--line:#2e2d29;--accent:#fb923c;--soft:#3a2416}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0;flex:1}
  .st{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.live{background:#dc2626;animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}
  button{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
  #he{flex:3;overflow-y:auto;padding:14px 16px;font-size:22px;line-height:1.6}
  #en{flex:2;overflow-y:auto;padding:12px 16px;direction:ltr;text-align:left;font-size:15px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
  .seg{margin:0 0 10px}
  .interim{font-style:italic;opacity:.7}
  .new{background:var(--soft);border-radius:6px}
  .lbl{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:8px 16px 0}
  #mic{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;
       background:var(--accent);color:#fff;border:none;font-size:32px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #mic.live{background:#dc2626}
  #msg{padding:8px 16px;font-size:14px;color:var(--accent)}
  .spacer{height:110px}
</style>
</head>
<body>
<header>
  <h1>English → עברית</h1>
  <span class="st"><span class="dot" id="dot"></span><span id="stx">מוכן</span></span>
  <button id="copy">העתק</button>
  <button id="clr">נקה</button>
</header>
<div id="msg" hidden></div>
<div class="lbl">עברית</div>
<div id="he"></div>
<div class="lbl" style="direction:ltr;text-align:left">ENGLISH</div>
<div id="en"><div class="spacer"></div></div>
<button id="mic" aria-label="מיקרופון">🎙</button>

<script>
const $=id=>document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, on=false, interimEl=null;
const segs=[]; const queue=[]; let busy=false;

function msg(t){$("msg").hidden=!t;$("msg").textContent=t||""}
function status(t,live){$("stx").textContent=t;$("dot").classList.toggle("live",!!live);$("mic").classList.toggle("live",!!live);$("mic").textContent=live?"⏹":"🎙"}
const spacer=$("en").querySelector(".spacer");
function down(el){el.scrollTop=el.scrollHeight}

function interim(t){
  if(!interimEl){interimEl=document.createElement("p");interimEl.className="seg interim";$("en").insertBefore(interimEl,spacer)}
  interimEl.textContent=t;down($("en"));
}
function final(t){
  t=t.trim(); if(!t) return;
  if(interimEl){interimEl.remove();interimEl=null}
  const s={en:t,he:""};
  s.enEl=document.createElement("p");s.enEl.className="seg";s.enEl.textContent=t;$("en").insertBefore(s.enEl,spacer);
  s.heEl=document.createElement("p");s.heEl.className="seg";s.heEl.textContent="…";$("he").appendChild(s.heEl);
  down($("en"));down($("he"));
  segs.push(s);queue.push(s);pump();
}

async function translate(text){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q="+encodeURIComponent(text);
  const r=await fetch(url); if(!r.ok) throw new Error(r.status);
  const j=await r.json(); return j[0].map(x=>x[0]).join("");
}
async function pump(){
  if(busy||!queue.length) return; busy=true;
  const s=queue.shift();
  try{ s.he=await translate(s.en); s.heEl.textContent=s.he; s.heEl.classList.add("new"); setTimeout(()=>s.heEl.classList.remove("new"),1500); msg("") }
  catch(e){ s.heEl.textContent="(שגיאת תרגום – בדוק חיבור לאינטרנט)"; }
  down($("he")); busy=false; pump();
}

function start(){
  if(!SR){msg("הדפדפן לא תומך בזיהוי דיבור. השתמש ב-Chrome באנדרואיד או ב-Safari באייפון.");return}
  rec=new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    let it="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) final(r[0].transcript); else it+=r[0].transcript;
    }
    if(it) interim(it);
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){on=false;status("מוכן");msg("אין הרשאה למיקרופון. אשר גישה בהגדרות הדפדפן ונסה שוב.")}
    else if(e.error!=="no-speech"&&e.error!=="aborted") msg("שגיאת מיקרופון: "+e.error);
  };
  // Mobile browsers stop after silence — restart automatically while active
  rec.onend=()=>{ if(on){ try{rec.start()}catch(_){setTimeout(()=>{if(on)try{rec.start()}catch(_){}} ,300)} } else status("מוכן") };
  on=true; status("מאזין…",true); msg("");
  try{rec.start()}catch(e){}
}
function stop(){on=false;if(rec)try{rec.stop()}catch(e){};status("מוכן")}

$("mic").onclick=()=>on?stop():start();
$("clr").onclick=()=>{segs.length=0;queue.length=0;$("he").innerHTML="";[...$("en").querySelectorAll(".seg")].forEach(n=>n.remove());interimEl=null};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(segs.map(s=>s.he).join("\n"));$("copy").textContent="✓";setTimeout(()=>$("copy").textContent="העתק",1200)}catch(e){msg("ההעתקה נחסמה")}};
if(!SR) msg("הדפדפן לא תומך בזיהוי דיבור. פתח ב-Chrome (אנדרואיד) או Safari (אייפון).");
</script>
</body>
</html>
