<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<title>מתרגם חי</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#76736b;--line:#e4e1d9;--accent:#c2410c;--soft:#fdebe1}
  @media (prefers-color-scheme:dark){:root{--bg:#141412;--card:#1d1d1a;--ink:#f1efe9;--muted:#9a968c;--line:#2e2d29;--accent:#fb923c;--soft:#3a2416}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0;flex:1}
  button{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;font-size:14px}
  #msg{padding:10px 14px;font-size:15px;background:var(--soft);color:var(--ink);border-bottom:1px solid var(--line)}
  .lbl{font-size:12px;letter-spacing:.06em;color:var(--muted);padding:8px 14px 4px;display:flex;justify-content:space-between;align-items:center}
  .pane{flex:1;overflow-y:auto;padding:4px 14px 12px;min-height:0}
  #en{direction:ltr;text-align:left;font-size:18px;line-height:1.55}
  #he{font-size:20px;line-height:1.6;border-top:1px solid var(--line)}
  .seg{margin:0 0 8px}
  .interim{color:var(--accent)}
  .wait{color:var(--muted)}
  .empty{color:var(--muted);font-size:15px;direction:rtl;text-align:right}
  footer{display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
  #mic{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;flex:none;padding:0}
  #mic.live{background:#dc2626;animation:p 1.4s infinite}@keyframes p{50%{opacity:.6}}
  #stx{flex:1;font-size:14px;color:var(--muted);line-height:1.4}
  #stx b{color:var(--ink)}
  label{font-size:13px;display:flex;align-items:center;gap:4px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>English → עברית</h1>
  <button id="trNow">תרגם עכשיו</button>
  <button id="copy">העתק</button>
  <button id="clr">נקה</button>
</header>
<div id="msg" hidden></div>

<div class="lbl"><span style="direction:ltr">ENGLISH · מה שנשמע</span></div>
<div class="pane" id="en"><p class="empty">לחץ על המיקרופון למטה. הטקסט באנגלית יופיע כאן תוך כדי.</p></div>

<div class="lbl"><span>עברית · תרגום</span><label><input type="checkbox" id="auto" checked> תרגום אוטומטי</label></div>
<div class="pane" id="he"></div>

<footer>
  <button id="mic" aria-label="מיקרופון">🎙</button>
  <div id="stx">מוכן. לחץ על המיקרופון כדי להתחיל.</div>
</footer>

<script>
const $=id=>document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, on=false, interimEl=null, results=0, sessionText="";
const segs=[];               // {en, he, enEl}
let translatedUpTo=0, translating=false, trTimer=null;

function msg(t){$("msg").hidden=!t;$("msg").textContent=t||""}
function status(t){$("stx").innerHTML=t}
function down(el){el.scrollTop=el.scrollHeight}
function clearEmpty(){const e=$("en").querySelector(".empty"); if(e) e.remove()}

// ---------- English transcript ----------
function showInterim(t){
  clearEmpty();
  if(!interimEl){interimEl=document.createElement("p");interimEl.className="seg interim";$("en").appendChild(interimEl)}
  interimEl.textContent=t; down($("en"));
}
function addFinal(t){
  t=t.replace(/\s+/g," ").trim(); if(!t) return;
  clearEmpty();
  if(interimEl){interimEl.remove();interimEl=null}
  const s={en:t,he:""};
  s.enEl=document.createElement("p"); s.enEl.className="seg"; s.enEl.textContent=t;
  $("en").appendChild(s.enEl); down($("en"));
  segs.push(s);
  status(`<b>מאזין…</b> ${segs.length} קטעים נשמעו`);
  scheduleTranslate();
}

// ---------- Translation: in the background, in batches ----------
async function translate(text){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q="+encodeURIComponent(text);
  const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json(); return j[0].map(x=>x[0]).join("");
}
function scheduleTranslate(){
  if(!$("auto").checked) return;
  clearTimeout(trTimer);
  trTimer=setTimeout(runTranslate, 4000);   // collect a few seconds of speech first
}
async function runTranslate(){
  if(translating || translatedUpTo>=segs.length) return;
  translating=true;
  const batch=segs.slice(translatedUpTo);
  const p=document.createElement("p"); p.className="seg wait"; p.textContent="מתרגם…"; $("he").appendChild(p); down($("he"));
  try{
    const he=await translate(batch.map(s=>s.en).join(" "));
    batch.forEach((s,i)=>s.he = i===batch.length-1 ? he : "");
    batch[batch.length-1].he=he;
    p.className="seg"; p.textContent=he;
    translatedUpTo+=batch.length;
  }catch(e){
    p.remove(); msg("התרגום נכשל ("+e.message+"). הטקסט באנגלית נשמר – לחץ 'תרגם עכשיו' כשיש אינטרנט.");
  }
  down($("he")); translating=false;
  if(translatedUpTo<segs.length) scheduleTranslate();
}

// ---------- Speech recognition ----------
// Uses short sessions (continuous=false) and restarts – the most reliable mode on iPhone.
function newRec(){
  const r=new SR();
  r.lang="en-US"; r.continuous=false; r.interimResults=true; r.maxAlternatives=1;
  r.onstart=()=>{ status(`<b>מאזין…</b> ${segs.length} קטעים נשמעו`) };
  r.onspeechstart=()=>{ status(`<b>שומע דיבור…</b>`) };
  r.onresult=e=>{
    results++;
    let fin="", it="";
    for(let i=0;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t+" "; else it+=t+" ";
    }
    sessionText=(fin+it).trim();
    showInterim(sessionText);
  };
  r.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      on=false; uiOff();
      msg("אין הרשאה למיקרופון או לזיהוי דיבור. באייפון: הגדרות ← Chrome (או Safari) ← מיקרופון ← הפעל. וגם: הגדרות ← כללי ← מקלדת ← 'הפעל הכתבה' חייב להיות דולק.");
    } else if(e.error==="network"){
      msg("זיהוי הדיבור דורש חיבור לאינטרנט.");
    } else if(e.error!=="no-speech" && e.error!=="aborted"){
      msg("שגיאת מיקרופון: "+e.error);
    }
  };
  r.onend=()=>{
    if(sessionText){ addFinal(sessionText); sessionText=""; }
    if(on) setTimeout(()=>{ if(on){ try{rec.start()}catch(_){ rec=newRec(); try{rec.start()}catch(__){} } } },150);
    else uiOff();
  };
  return r;
}
function uiOff(){ $("mic").classList.remove("live"); $("mic").textContent="🎙"; status(`עצור. ${segs.length} קטעים נשמעו.`) }
function start(){
  if(!SR){ msg("הדפדפן הזה לא תומך בזיהוי דיבור. באייפון פתח את הקישור ב-Safari."); return; }
  msg(""); on=true; sessionText="";
  $("mic").classList.add("live"); $("mic").textContent="⏹";
  rec=newRec();
  try{ rec.start(); status("<b>מתחיל להאזין…</b>"); }catch(e){ msg("לא הצלחתי להפעיל את המיקרופון: "+e.message); on=false; uiOff(); }
}
function stop(){ on=false; try{rec&&rec.stop()}catch(e){} uiOff(); if($("auto").checked) runTranslate(); }

$("mic").onclick=()=>on?stop():start();
$("trNow").onclick=()=>{ clearTimeout(trTimer); runTranslate(); };
$("auto").onchange=()=>{ if($("auto").checked) scheduleTranslate(); };
$("clr").onclick=()=>{ segs.length=0; translatedUpTo=0; $("he").innerHTML=""; $("en").innerHTML=""; interimEl=null; status("נוקה."); };
$("copy").onclick=async()=>{
  const txt="ENGLISH:\n"+segs.map(s=>s.en).join(" ")+"\n\nעברית:\n"+segs.map(s=>s.he).filter(Boolean).join("\n");
  try{await navigator.clipboard.writeText(txt);$("copy").textContent="✓";setTimeout(()=>$("copy").textContent="העתק",1200)}catch(e){msg("ההעתקה נחסמה")}
};
if(!SR) msg("הדפדפן הזה לא תומך בזיהוי דיבור. באייפון פתח את הקישור ב-Safari.");
</script>
</body>
</html>
